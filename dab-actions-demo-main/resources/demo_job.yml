resources:
  jobs:
    demo_notebook_job:
      name: ${bundle.target}-notebook-demo

      tasks:
        - task_key: run_demo_notebook

          notebook_task:
            notebook_path: ../src/demo_notebook.ipynb

            base_parameters:
              environment: ${bundle.target}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"